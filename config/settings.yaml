# NiteSentinel Default Configuration
app:
  name: NiteSentinel
  version: 1.2.0
  company: NITECHSPARK
  license: MIT

reporting:
  org_name: NITECHSPARK
  output_dir: reports/
  default_format: pdf

scanning:
  timeout: 30
  ssh_timeout: 10
  snmp_community: public

web:
  port: 8080
  debug: false
  session_timeout_hours: 8
  auth:
    enabled: true
    username: "nitechspark_admin"
    password: "NiteSentinel@2026"
    users:
      - username: "admin"
        password: "NiteSentinel@2026"
        role: "admin"
      - username: "viewer"
        password: "ViewOnly@2026"
        role: "viewer"

branding:
  organization_name: "NITECHSPARK"
  client_name: "Default Client"
  report_primary_color: "#00d4ff"
