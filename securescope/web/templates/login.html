<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiteSentinel Enterprise Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top, #101a35 0%, #0a0e1a 40%); color: #e8eaf6; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, sans-serif; }
        .login-card { background-color: #0f1629; border: 1px solid #1e2d4a; border-radius: 1.5rem; width: 100%; max-width: 420px; padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .form-control { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 0.75rem; padding: 0.75rem 1rem; }
        .form-control:focus { background-color: #0f172a; color: #f8fafc; border-color: #06b6d4; box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2); }
        .btn-cyan { background-color: #00d4ff; color: #031017; border-radius: 0.75rem; padding: 0.75rem; font-weight: 700; width: 100%; transition: all 0.2s; border: none; }
        .btn-cyan:hover { background-color: #2edfff; transform: translateY(-1px); }
        .logo-img { height: 60px; margin-bottom: 1.5rem; }
        .footer { margin-top: 2rem; font-size: 0.875rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <img src="/logo.png" alt="NITECHSPARK" class="logo-img" onerror="this.style.display='none'">
            <h2 class="fw-bold mb-1">NiteSentinel</h2>
            <p class="text-secondary small mb-4">NITECHSPARK Enterprise Security Platform</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small text-secondary">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small text-secondary">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-cyan">Login to Dashboard</button>
        </form>

        <div class="footer">
            Secured by <span style="color:#06b6d4">NITECHSPARK</span>
        </div>
    </div>
</body>
</html>
