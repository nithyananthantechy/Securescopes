<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(6, 5)">
    <!-- Ambient Glow behind emblem -->
    <circle cx="30" cy="30" r="28" fill="url(#glowGlow)" />

    <!-- Outer Tech Hex-Shield Perimeter -->
    <path d="M 30 2 L 56 14 L 56 36 L 30 58 L 4 36 L 4 14 Z" 
          stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" fill="#0B1220" />

    <!-- Inner Protective Segment -->
    <path d="M 30 8 L 49 18 L 49 34 L 30 50 L 11 34 L 11 18 Z" 
          stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.2" fill="#070D18" />

    <!-- Radar / Scanning Reticle Lines -->
    <circle cx="30" cy="27" r="14" stroke="#1E2E4A" stroke-width="1.2" stroke-dasharray="2 3" />
    <circle cx="30" cy="27" r="8" stroke="rgba(0, 229, 255, 0.5)" stroke-width="1.5" />
    
    <!-- Central Sentinel Core Node (Pulsing Diamond) -->
    <path d="M 30 21 L 35 27 L 30 33 L 25 27 Z" fill="url(#coreGrad)" filter="url(#neonFilter)" />

    <!-- Cyber Crosshair Tick Marks -->
    <line x1="30" y1="9" x2="30" y2="15" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="39" x2="30" y2="45" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="27" x2="18" y2="27" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
    <line x1="42" y1="27" x2="48" y2="27" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />

    <!-- Corner Accents -->
    <polygon points="30,4 32,8 28,8" fill="#00E5FF" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <g transform="translate(74, 15)">
    <!-- Main Brand Title -->
    <text x="0" y="24" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-weight="800" 
          font-size="22" 
          letter-spacing="1.5" 
          fill="url(#textGrad)">
      NITE<tspan fill="#00E5FF">SENTINEL</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="39" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-weight="600" 
          font-size="8.5" 
          letter-spacing="2.8" 
          fill="#64748B">
      CYBER DEFENSE &amp; POSTURE
    </text>

    <!-- Tech Security Badge Dot -->
    <circle cx="166" cy="18" r="3" fill="#00FFA3" filter="url(#neonFilter)" />
  </g>
</svg>
